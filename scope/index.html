<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Status board for reconstructing Ragnarok Online skill visual effects against the original client.">
<title>Trans &amp; Expanded board</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#12151a; --bg-deep:#0c0e12; --bg-pane:#0f1218; --bg-hover:#171c24;
  --bg-sel:#1e2937; --line:#232833; --line-soft:#1a1e26;
  --ink:#dfe4ea; --ink-dim:#8b98a8; --ink-faint:#5d6b7d; --ink-mono:#b8c4d0;
  --cur:#4ea1ff; --work:#c9962f; --ok:#3ea06b; --bad:#c05a5a;
  --mono:Consolas,"Cascadia Mono",ui-monospace,monospace;
}
body{margin:0;font:13px/1.45 "Segoe UI",system-ui,sans-serif;
 background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:#7fd1ff}
:focus-visible{outline:2px solid var(--cur);outline-offset:1px}
#top{display:flex;align-items:center;gap:14px;padding:9px 14px;background:var(--bg-deep);
 border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
#top h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.3px;flex:none}
#q{font-family:var(--mono);font-size:12px;color:#9fb3c8;flex:1;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#froze{font-family:var(--mono);font-size:11px;color:var(--ink-faint);flex:none}
#wrap{display:flex;height:calc(100vh - 41px)}
#side{width:250px;overflow-y:auto;border-right:1px solid var(--line);
 background:var(--bg-pane);flex:none}
#mid{width:390px;overflow-y:auto;border-right:1px solid var(--line);flex:none}
#det{flex:1;overflow-y:auto;padding:14px 18px}
.tier{padding:7px 12px 3px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
 color:var(--ink-faint);border-top:1px solid #1b1f27;margin-top:5px}
.cls{padding:5px 12px;cursor:pointer;display:flex;align-items:center;gap:7px}
.cls:hover{background:var(--bg-hover)}
.cls.sel{background:var(--bg-sel)}
.cls.cur{box-shadow:inset 3px 0 0 var(--cur)}
.cls .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cls .pfx{color:#7f8c9d;font-family:var(--mono);font-size:11px;width:52px;flex:none}
.bar{width:44px;height:5px;background:#232a35;border-radius:3px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--ok)}
.cls .w{font-size:10px;color:var(--work);width:22px;text-align:right;flex:none;
 font-variant-numeric:tabular-nums}
.cls.closed .nm{color:var(--ink-faint)}
#chdr{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg-pane);
 position:sticky;top:0}
#chdr h2{margin:0 0 4px;font-size:15px}
#chdr .sub{font-size:11px;color:var(--ink-dim)}
.row{padding:7px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;display:flex;
 gap:8px;align-items:baseline}
.row:hover{background:var(--bg-hover)}
.row.sel{background:var(--bg-sel)}
.row.inbatch{box-shadow:inset 3px 0 0 var(--work)}
.row .a{flex:1;font-family:var(--mono);font-size:12px;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.row.done .a{color:#6f7d8c}
.b{font-size:9.5px;padding:1px 6px;border-radius:9px;letter-spacing:.4px;
 font-weight:600;white-space:nowrap;flex:none}
.VERIFY{background:#2b4a33;color:#8fe0aa}
.TRANSFER{background:#4a3f22;color:#e8c674}
/* row-list eyeball marker: sits just before the lane badge */
.eyet{flex:none;margin-left:auto;margin-right:6px;font-size:12px;font-weight:800;line-height:1}
/* --- owner eyeball ------------------------------------------------------ */
/* Same colour vocabulary as the live board (class_board.py) so a verdict does
   not change meaning between the two pages. */
.eye-unset{color:#6b7480}
.eye-fail{color:#ff8b8b;font-weight:bold}
.eye-rework{color:#e8c06a}
.eye-pass{color:#7fd18a;font-weight:bold}
.inh{color:#6b7480;font-size:10px}
/* The row-level verdict LEADS the row: it is the one value on this board that is
   not derived from anything, so it gets size rather than a column. */
.eyebox{margin:10px 0 4px;padding:9px 12px;border-radius:6px;
  border:1px solid #2e3846;background:#161a22;display:block}
.eyebox.eye-pass{border-color:#2f6b41;background:#14241a}
.eyebox.eye-fail{border-color:#7a3535;background:#241414}
.eyebox.eye-rework{border-color:#6b5a2a;background:#221e12}
.eyelab{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:#8b95a5;font-family:var(--mono)}
.eyev{display:inline-block;margin-top:2px;font-size:23px;font-weight:800;
  letter-spacing:.02em;line-height:1.15}
.eyed{margin-left:9px;font-size:11px;color:#8b95a5;font-family:var(--mono)}
.eyen{margin-top:3px;font-size:11px;color:#a9b2c0}
.BUILD{background:#4a2b2b;color:#f0a0a0}
.DONE{background:#1f3a2a;color:#5d8f6f}
.BLOCKED{background:#33333d;color:#9aa0b0}
.UNBLOCK{background:#3d2b4a;color:#c9a0f0}
.ax{display:inline-block;font-size:10px;font-family:var(--mono);
 padding:1px 6px;border-radius:3px;background:#1c222c;color:#9fb3c8;margin:0 4px 4px 0}
.ax b{color:var(--ink);font-weight:600}
.ax.good b{color:#8fe0aa}.ax.bad b{color:#f0a0a0}.ax.warn b{color:#e8c674}
h3{margin:16px 0 6px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
 color:#6f7d8c;border-bottom:1px solid var(--line);padding-bottom:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;font-weight:600;color:var(--ink-dim);font-size:10px;letter-spacing:.6px;
 text-transform:uppercase;padding:3px 8px 3px 0;border-bottom:1px solid var(--line)}
td{padding:3px 8px 3px 0;border-bottom:1px solid #191d24;vertical-align:top;
 font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
pre{background:var(--bg-deep);border:1px solid #1e232c;border-radius:4px;padding:9px 11px;
 overflow-x:auto;font-family:var(--mono);font-size:11.5px;line-height:1.5;
 white-space:pre-wrap;color:var(--ink-mono);max-height:420px;overflow-y:auto}
.why{background:#1a1710;border-left:3px solid var(--work);padding:8px 11px;
 border-radius:0 4px 4px 0;color:#e0d4b8;font-size:12px}
.tick{background:#1a1013;border-left:3px solid var(--bad);padding:6px 11px;margin:4px 0;
 border-radius:0 4px 4px 0;font-size:11.5px}
.tick.closed{background:#101a13;border-color:var(--ok);color:var(--ink-dim)}
.kv{color:#7f8c9d}
.warnv{color:#f0a0a0}
#det h2{margin:0 0 2px;font-size:17px;font-family:var(--mono)}
.clip{margin:10px 0 4px;border:1px solid var(--line);border-radius:5px;
 background:var(--bg-deep);overflow:hidden}
.clip img{display:block;width:100%;height:auto;background:#0a0c10}
.clip .cap{padding:5px 9px;font-family:var(--mono);font-size:10.5px;
 color:var(--ink-faint);border-top:1px solid var(--line-soft)}
.clip .cap b{color:var(--ink-dim);font-weight:600}
.tri{margin:8px 0 0;padding:6px 10px;border-radius:4px;font-family:var(--mono);font-size:11px}
.tri b{font-weight:700;letter-spacing:.4px}
.tri .tn{color:var(--ink-dim);margin-top:3px;font-family:inherit}
.tri-close{background:#12241a;border:1px solid #235c3c;color:#7fd6a2}
.tri-partial{background:#241f10;border:1px solid #5c4a1e;color:#dcb968}
.tri-notclose{background:#2a1414;border:1px solid #6b2b2b;color:#e58a8a}
.tri-placement{background:#151d2a;border:1px solid #2c4468;color:#8fb4e8}
.tri-invalid{background:#1d1a24;border:1px solid #443a5c;color:#b09ad6}
.tri-unclear{background:#1a1d20;border:1px solid #333a42;color:#93a2b2}
.tri-recaptured{background:#102422;border:1px solid #1f5c55;color:#79d4c6}
.clipnone{margin:10px 0 4px;padding:7px 10px;border:1px dashed var(--line);
 border-radius:5px;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
#det .dsub{color:var(--ink-dim);font-size:12px;margin-bottom:10px}
.empty{padding:30px 14px;color:var(--ink-faint);text-align:center}
#filt{padding:6px 14px;border-bottom:1px solid var(--line);display:flex;gap:6px}
#filt input{flex:1;background:var(--bg);border:1px solid #2e3846;color:var(--ink);
 border-radius:4px;padding:3px 8px;font:inherit}
#legend{padding:8px 12px;font-size:10.5px;color:var(--ink-faint);line-height:1.7}
#legend .b{margin-right:5px}
@media (max-width:900px){
  #wrap{display:block;height:auto}
  #side,#mid{width:auto;border-right:0;border-bottom:1px solid var(--line);
   max-height:44vh;overflow-y:auto}
  #chdr{position:static}
  #det{padding:12px 14px}
}

.DIFFERS{background:#4a2b2b;color:#f0a0a0}
.NOT-CHECKED{background:#4a3f22;color:#e8c674}
.NOT-BUILT{background:#33333d;color:#b0b6c4}
.MATCHES{background:#1f3550;color:#8cc4ff}
.DONE{background:#1f3a2a;color:#8fe0aa}
.NO-EFFECT{background:#23262d;color:#7d8694}
#sumbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 4px}
#sumbar i{display:block;height:100%}
</style>
</head>

const CLIPS={};
const TRIAGE={};
let selC=null, selR=null, q="";
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// The hash is the whole router: #PREFIX or #PREFIX/AEGIS. A link to a row is
// therefore just the page URL, which is the point of publishing this at all.
function readHash(){
  const h=decodeURIComponent(location.hash.replace(/^#/,"")).split("/");
  const c=D.classes.find(x=>x.prefix===h[0]);
  if(!c) return false;
  selC=c.prefix;
  selR=(h[1]&&c.rows_detail.some(r=>r.aegis===h[1]))?h[1]:null;
  return true;
}
// Only reaches the address bar when the file is opened directly; a host that
// frames the page keeps the hash inside the frame, and an opaque-origin frame
// throws on replaceState outright - neither is worth losing the row over.
function writeHash(){
  const want="#"+selC+(selR?"/"+selR:"");
  try{ if(location.hash!==want) history.replaceState(null,"",want); }catch(e){}
}
function boot(){
  document.getElementById("q").textContent=D.queue_line;
  if(!readHash()) selC=D.current||D.classes[0].prefix;
  drawSide(); drawMid();
  if(selR) show(selR); else clearDet();
}
function clearDet(){
  document.getElementById("det").innerHTML='<div class="empty">pick a row</div>';
}
function drawSide(){
  let h="",t=null;
  for(const c of D.classes){
    if(c.tier!==t){t=c.tier;h+='<div class="tier">'+t+'</div>';}
    const closed=c.workable===0;
    h+='<div class="cls'+(c.prefix===selC?" sel":"")+(c.prefix===D.current?" cur":"")
      +(closed?" closed":"")+'" onclick="pick(\''+c.prefix+'\')">'
      +'<span class="pfx">'+c.prefix+'</span>'
      +'<span class="nm">'+esc(c.name)+'</span>'
      +'<span class="bar"><i style="width:'+c.pct+'%"></i></span>'
      +'<span class="w">'+(c.workable||"")+'</span></div>';
  }
  const T=D.totals;
  h+='<div class="tier">total</div><div class="cls"><span class="nm">'

    +'<div id="legend">'
    +'<span class="b DIFFERS">DIFFERS</span>compared to the game and it does not match (or you flagged it)<br>'
    +'<span class="b NOT-CHECKED">NOT-CHECKED</span>built, but not yet compared to the game<br>'
    +'<span class="b NOT-BUILT">NOT-BUILT</span>the port does not show this skill yet<br>'
    +'<span class="b MATCHES">MATCHES</span>matches the game; waiting for your eye check<br>'
    +'<span class="b DONE">DONE</span>matches the game and you approved it by eye<br>'
    +'<span class="b NO-EFFECT">NO-EFFECT</span>the game draws no effect for this skill; nothing to match<br>'
    +'<br>Bar = share of the class that matches the game. Number = rows that still need work.</div>';
  document.getElementById("side").innerHTML=h;
}
function pick(p){selC=p;selR=null;writeHash();drawSide();drawMid();clearDet();}
function cls(){return D.classes.find(c=>c.prefix===selC);}
// A one-glyph owner-eyeball marker for the ROW LIST, so the verdict is readable
// without opening every row. Only DECIDED verdicts draw: `unset` is the state of
// almost every row, and a marker on all of them would be noise rather than
// signal — the absence IS the "nobody has looked" reading.
function eyeMark(r){
  const v=(r.ab&&r.ab.row&&r.ab.row.verdict)||"unset";
  if(v==="unset") return "";
  const g={pass:"✓",fail:"✗",rework:"~"}[v]||"?";
  return '<span class="eyet eye-'+v+'" title="owner eyeball: '+v+'">'+g+'</span>';
}
function drawMid(){
  const c=cls();
  let h='<div id="chdr"><h2>'+c.prefix+' '+esc(c.name)+'</h2><div class="sub">'
    +c.tier+' tier &middot; '+c.rows+' rows &middot; '+c.done+' match the game ('+c.pct+'%) &middot; '
    +c.workable+' need work &middot; '+c.blocked+' waiting for your eye check'
    +(c.prefix===D.current?' &middot; <b style="color:var(--cur)">CURRENT CLASS</b>':'')
    +'</div></div>'
    +'<div id="filt"><input placeholder="filter rows" value="'+esc(q)
    +'" oninput="q=this.value;drawMid()"></div>';
  const order={"DIFFERS":0,"NOT-CHECKED":1,"NOT-BUILT":2,"MATCHES":3,"DONE":4,"NO-EFFECT":5};
  const rows=c.rows_detail.slice().sort((a,b)=>
    (order[a.lane]??9)-(order[b.lane]??9)||a.aegis.localeCompare(b.aegis));
  for(const r of rows){
    if(q&&!(r.aegis+" "+r.display+" "+r.overall).toLowerCase().includes(q.toLowerCase()))continue;
    h+='<div class="row'+(r.aegis===selR?" sel":"")+(c.batch.includes(r.aegis)?" inbatch":"")
      +(r.lane==="DONE"?" done":"")+'" onclick="show(\''+r.aegis+'\')">'
      +'<span class="a">'+r.aegis+'</span>'
      +eyeMark(r)
      +'<span class="b '+r.lane+'">'+r.lane+'</span></div>';
  }
  document.getElementById("mid").innerHTML=h;
}
function ax(k,v){
  const good=["full","fresh","COMPLETE"],bad=["none","unknown","NO-ROW","EMPTY"];
  const c=good.includes(v)?"good":bad.includes(v)?"bad":"warn";
  return '<span class="ax '+c+'">'+k+' <b>'+esc(v)+'</b></span>';
}
function show(a){
  selR=a;writeHash();drawMid();
  const r=cls().rows_detail.find(x=>x.aegis===a);
  let h='<h2>'+r.aegis+'</h2><div class="dsub">'+esc(r.display||"(no display name)")

    +(r.line?":"+r.line:"")+' &middot; hash '+esc(r.row_hash)+'</div>';
  h+='<span class="b '+r.lane+'">'+r.lane+'</span> <span class="ax"><b>'+esc(r.overall)+'</b></span><br><br>';
  for(const k of ["decode","wiring","verify","coverage"]) h+=ax(k,r.axes[k]);
  if(r.parked) h+='<span class="ax bad">PARKED <b>yes</b></span>';

  // ⛔ THE EYEBALL VERDICT, WHICH THIS PAGE DID NOT RENDER AT ALL.
  // `class_board.py` offers the owner pass/fail buttons and stores the answer in
  // AB_STATUS.json; the snapshot has carried it under `ab.row` the whole time and
  // `trim()` never touched it — the published page simply never read it, so a
  // verdict set on localhost vanished here and looked like it had not been saved.
  // It leads the row rather than sitting in a column: it is the ONE value on this
  // board derived from nothing but a human looking at the effect, so `unset` is a
  // real state that has to be visible, not an empty cell.
  const eb=(r.ab&&r.ab.row)?r.ab.row:{verdict:"unset",note:"",date:""};
  const ev=eb.verdict||"unset";
  h+='<div class="eyebox eye-'+esc(ev)+'"><span class="eyelab">owner eyeball</span>'
    +'<span class="eyev">'+esc(ev.toUpperCase())+'</span>'
    +(eb.date?'<span class="eyed">'+esc(eb.date)+'</span>':'')
    +(eb.note?'<div class="eyen">'+esc(eb.note)+'</div>':'')
    +(ev==="unset"?'<div class="eyen">nobody has watched this row cast yet. '
      +'COMPLETE is not DONE without it.</div>':'')
    +'</div>';

  // The A/B CLIP. The eyeball verdict above is a human judgement about what the
  // effect looks like, and until now the page asserted it without ever showing
  // the thing being judged. This is that footage: PORT on the left, EXE on the
  // right, one capture, timelines normalised. Lazy so the page still opens fast.
  // AGENT TRIAGE of the clip below. Separate from the owner eyeball above: this is
  // Claude reading the peak frames, and it says whether the clip can answer the
  // question AT ALL before it says whether the port matches.
  const tv=TRIAGE[r.aegis];
  if(tv){
    const lbl={close:'CLOSE',partial:'NEEDS A TWEAK',notclose:'PORT BUG',

    h+='<div class="tri tri-'+esc(tv.c)+'"><b>agent triage &middot; '+esc(lbl)+'</b>'
      +(tv.n?'<div class="tn">'+esc(tv.n)+'</div>':'')+'</div>';
  }

  const cl=CLIPS[r.aegis];

    h+='<div class="clip"><img loading="lazy" decoding="async" width="'+cl.w+'" height="'+cl.h+'"'
      +' src="clips/'+encodeURIComponent(r.aegis)+'.webp" alt="'+esc(r.aegis)+' port vs exe">'
      +'<div class="cap"><b>PORT</b> rol-browser-logic &nbsp;|&nbsp; <b>EXE</b> RO-2026.exe'
      +' &middot; '+cl.frames+' frames &middot; timelines normalised, auto-cropped'
      +' &mdash; not evidence about duration or scale</div></div>';
  } else {
    h+='<div class="clipnone">no A/B clip captured for this row yet</div>';
  }

  if(r.why) h+='<h3>why the board says this</h3><div class="why">'+esc(r.why)+'</div>';

  h+='<h3>effect ids the exe fires ('+r.exe_ids.length+')</h3>';
  if(!r.exe_ids.length) h+='<div class="kv">none in the exe map</div>';
  else{
    // A/B, runs and the per-id eyeball were on the live board's table and missing
    // from this one, so a published row could not be told apart from one that had
    // never been through the rig. `eye_src` distinguishes an id carrying its OWN
    // override from one merely inheriting the row verdict.
    h+='<div class="tw"><table><tr><th>id</th><th>kind</th><th>verdict</th><th>signal</th>'
      +'<th>vs game</th><th>decode</th><th>verify</th><th>A/B</th><th>runs</th><th>eyeball</th></tr>';
    for(const id of r.exe_ids){
      const p=r.per_id[String(id)]||{};
      const a=(r.ab&&r.ab.ids)?(r.ab.ids[String(id)]||{}):{};
      const bad=["MISSING","UNKNOWN"].includes(p.verdict);
      const ae=a.eyeball||"unset";
      h+='<tr><td>'+id+'</td><td>'+esc(p.kind||"-")+'</td><td'+(bad?' class="warnv"':'')
        +'>'+esc(p.verdict||"-")+'</td><td>'+esc(p.signal||"-")+'</td><td>'+esc((r.vv_ids||{})[String(id)]||"-")+'</td><td>'
        +esc(p.decode||"-")+'</td><td>'+esc(p.verify||"-")+'</td>'
        +'<td>'+esc(a.ab||"none")+'</td><td>'+esc(String(a.runs==null?0:a.runs))+'</td>'
        +'<td class="eye-'+esc(ae)+'">'+esc(ae)
        +(a.eye_src==="row"?' <span class="inh">(row)</span>':'')+'</td></tr>';
    }
    h+='</table></div>';
  }
  if(r.shared_ids.length) h+='<div class="kv" style="margin-top:6px">shared ids: '
    +r.shared_ids.join(", ")+'</div>';
  if(Object.keys(r.slots).length) h+='<div class="kv">slots: '
    +esc(JSON.stringify(r.slots))+'</div>';
  if(Object.keys(r.arms).length) h+='<div class="kv">arms ('+r.arm_count+'): '
    +esc(JSON.stringify(r.arms))+'</div>';

  h+='<h3>stamps in the port row</h3>';
  if(!r.stamps.length) h+='<div class="kv">none - this row carries no @decoded / '
    +'@covers / @verified / @na</div>';
  else{h+='<div class="tw"><table><tr><th>stamp</th><th>ids</th><th>detail</th></tr>';
    for(const s of r.stamps)
      h+='<tr><td>@'+s.kind+'</td><td>'+s.ids.join(", ")+'</td><td'
        +(s.ok?'':' class="warnv"')+'>'+esc(s.text||"")
        +(s.note?" &#9888; "+s.note:"")+'</td></tr>';
    h+='</table></div>';}

  if(r.tickets.length){h+='<h3>tickets naming this row</h3>';
    for(const t of r.tickets)
      h+='<div class="tick'+(t.closed?" closed":"")+'">'+(t.closed?"CLOSED &middot; ":"OPEN &middot; ")
        +esc(t.head)+'</div>';}

  if(r.log) h+='<h3>last work-log mention</h3><div class="kv">'+esc(r.log)+'</div>';

  const m=r.mech;
  h+='<h3>mechanics / assets</h3><div class="kv">'
    +["type","target","element","hit","hit_count","aoe"].filter(k=>m[k]!=null&&m[k]!=="")
      .map(k=>k+"="+esc(m[k])).join(" &middot; ")
    +(r.exe_str?"<br>exe str: "+esc(r.exe_str):"")
    +(r.exe_wav?"<br>exe wav: "+esc(r.exe_wav):"")+'</div>';

  if(r.has_port_row){
    if(D.trimmed) h+='<h3>port row</h3><div class="kv">ships from '+esc(r.file)
      +(r.line?":"+r.line:"")+' &middot; source omitted from this copy</div>';
    else{
      if(r.comment) h+='<h3>port prose</h3><pre>'+esc(r.comment)+'</pre>';
      h+='<h3>port row</h3><pre>'+esc(r.body)+'</pre>';
    }
  } else h+='<h3>port row</h3><div class="kv warnv">NO ROW in '
    +'core/effects/skill_fx - nothing ships for this skill</div>';
  const det=document.getElementById("det");
  det.innerHTML=h;
  // Stacked layout puts the detail below two 44vh scroll boxes, so a click on a
  // row scrolls nothing into view and reads as a dead control.
  if(matchMedia("(max-width:900px)").matches)
    det.scrollIntoView({block:"start",behavior:"smooth"});
}
addEventListener("hashchange",()=>{if(readHash()){drawSide();drawMid();
  if(selR) show(selR); else clearDet();}});
boot();
</script>
</body>
</html>
