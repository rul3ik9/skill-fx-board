<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Fix status for every row of the ROL Browser skill checklist.">
<title>QA checklist fixes</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f6f7f9; --pane:#ffffff; --line:#e1e4e8; --ink:#1d232b; --dim:#5d6875; --faint:#8a94a0;
  --sel:#e8f1ff; --accent:#1f6feb;
  --s-open:#b5452f; --s-fixed:#a86d00; --s-matched:#1d7f4c; --s-not_a_defect:#2b7a8c;
  --s-needs_owner:#7a4fb5; --s-out_of_lane:#6b7480; --s-blocked_qa:#6b7480; --s-pass:#3d8a5a;
  --s-not_in_game:#9aa1aa;
  --mono:Consolas,"Cascadia Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151a; --pane:#171b22; --line:#262c36; --ink:#dfe4ea; --dim:#9aa6b4; --faint:#6b7889;
  --sel:#1e2937; --accent:#4ea1ff;
  --s-open:#e0765e; --s-fixed:#e0a940; --s-matched:#4fbf83; --s-not_a_defect:#5ab4c8;
  --s-needs_owner:#b48ae8; --s-out_of_lane:#8592a2; --s-blocked_qa:#8592a2; --s-pass:#62b585;
  --s-not_in_game:#5f6a77;
}}
body{margin:0;background:var(--bg);color:var(--ink);
 font:14px/1.5 "Segoe UI","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif}
header{padding:18px 16px 8px;max-width:1800px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--dim);font-size:13px}
.sub code{font-family:var(--mono);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{border:1px solid var(--line);background:var(--pane);border-radius:8px;padding:6px 10px;
 cursor:pointer;color:var(--ink);font:inherit;text-align:left;min-width:110px}
.chip b{display:block;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.chip span{font-size:12px;color:var(--dim)}
.chip[aria-pressed="true"]{outline:2px solid var(--accent);background:var(--sel)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.tools input,.tools select{font:inherit;padding:6px 8px;border:1px solid var(--line);
 border-radius:6px;background:var(--pane);color:var(--ink)}
.tools input{flex:1;min-width:180px;max-width:360px}
.count{color:var(--dim);font-size:13px}
main{max-width:1800px;margin:0 auto;padding:0 16px 40px}
table{width:100%;border-collapse:collapse;background:var(--pane);border:1px solid var(--line);
 border-radius:8px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:12px;color:var(--dim);font-weight:600;background:var(--bg);position:sticky;top:0}
td.n{font-family:var(--mono);font-weight:600;white-space:nowrap}
td.sk{font-family:var(--mono);font-size:13px;white-space:nowrap}
td.sk small{display:block;font-family:inherit;color:var(--dim);font-size:12px}
.st{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;
 border-radius:4px;color:#fff;white-space:nowrap}
.res{font-size:11px;font-weight:600;color:var(--dim)}
.th{font-size:13px}
.th .e{color:var(--dim);margin-top:4px}
.th .e::before{content:"expected: ";color:var(--faint)}
.tags span{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;
 padding:0 5px;margin:0 3px 3px 0;color:var(--dim)}
.tags span.in{border-color:var(--accent);color:var(--accent)}
.note{font-size:13px;max-width:none}
.note .meta{font-size:12px;color:var(--faint);margin-top:4px;font-family:var(--mono)}
.note .pth{font-size:14px;line-height:1.5}
.note .pen{font-size:13px;color:var(--dim);margin-top:2px}
details.tech{margin-top:6px}
details.tech summary{cursor:pointer;color:var(--faint);font-size:12px}
details.tech > div{font-size:12px;color:var(--dim);margin-top:4px}
tr:target td{background:var(--sel)}
a{color:var(--accent)}
/* Media row: a full-width strip under each skill, so the GIFs get the whole page
   width instead of the last table column. port|exe is the wide one (it is two
   clients side by side); the tester's reference sits next to it. */
tr.media td{padding:4px 12px 18px;background:var(--pane)}
tr.media + tr td, tr.media td{border-bottom:2px solid var(--line)}
.clips{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.clips.one{grid-template-columns:minmax(0,1fr)}
figure.clip{margin:0}
figure.clip figcaption{color:var(--dim);font-size:13px;font-weight:600;margin-bottom:6px}
figure.clip img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;
 cursor:zoom-in;background:#000}
.nogif{color:var(--faint);font-size:12px;font-family:var(--mono)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;
 justify-content:center;z-index:9;cursor:zoom-out;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:6px;image-rendering:auto}
.empty{padding:30px;text-align:center;color:var(--dim)}
@media (max-width:1100px){ .clips{grid-template-columns:minmax(0,1fr)} }
@media (max-width:900px){
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border-bottom:1px solid var(--line);padding:8px 0}
  td{border:0;padding:4px 12px}
  td.n{font-size:15px}
  .note{max-width:none}
}
</style>
</head>
<body>
<header>
  <h1>QA checklist &mdash; fix status</h1>
  <div class="sub">Sheet <code>[ROL Browser] Skill checklist (2).xlsx</code> &middot; row&nbsp;# = the sheet's own row number &middot; frozen 2026-10-10 15:39</div>

    <label class="count"><input type="checkbox" id="lane"> VFX/sound rows only</label>

</header>

</table>

const STATUS = [["open", "TO FIX", "failed in the sheet, VFX or sound, not fixed yet"], ["fixed", "FIXED", "the port is changed and proven in the port; not yet compared live against the game"], ["matched", "MATCHES GAME", "fixed and compared live against RO-2026.exe -- finished"], ["not_a_defect", "SAME AS GAME", "the real game does the same thing; nothing to fix"], ["needs_owner", "ASK OWNER", "a question about what the game should contain"], ["out_of_lane", "NOT VFX/SOUND", "failed on motion, UI or server -- outside this fix lane"], ["blocked_qa", "TESTER BLOCKED", "the tester could not test it (sheet says BLOCKED)"], ["not_in_game", "NOT IN THEIR GAME", "the tester's game does not have this skill -- ignored, no fix and no GIF"], ["pass", "PASS", "the tester passed it; never re-opened"]];
const label = Object.fromEntries(STATUS.map(s => [s[0], s[1]]));
const expl = Object.fromEntries(STATUS.map(s => [s[0], s[2]]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let want = new Set();

function readHash(){
  const h = new URLSearchParams(location.hash.replace(/^#\??/, "").includes("=") ? location.hash.slice(1) : "");
  if (h.get("s")) want = new Set(h.get("s").split(","));
  if (h.get("c")) document.getElementById("cls").value = h.get("c");
  if (h.get("q")) document.getElementById("q").value = h.get("q");
}
function chips(){
  const n = {}; DATA.forEach(r => n[r.status] = (n[r.status]||0) + 1);
  document.getElementById("chips").innerHTML = STATUS.map(([k, w, e]) =>
    `<button class="chip" data-k="${k}" title="${esc(e)}" aria-pressed="${want.has(k)}">
       <b>${n[k]||0}</b><span><i style="background:var(--s-${k})"></i>${esc(w)}</span></button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const k = b.dataset.k; want.has(k) ? want.delete(k) : want.add(k); chips(); draw();
  });
}
function classes(){
  const sel = document.getElementById("cls");
  [...new Set(DATA.map(r => r.cls))].forEach(c => sel.insertAdjacentHTML("beforeend",
    `<option>${esc(c)}</option>`));
}
function refHtml(r){
  return r.ref_gif ? `<figure class="clip ref"><figcaption>Tester's reference exe (client only, ~8 s around the cast) &mdash; click to enlarge</figcaption>
    <img loading="lazy" src="${esc(r.ref_gif)}" alt="${esc(r.skill)} tester reference exe"></figure>` : "";
}
function clipHtml(r){
  const when = r.status === "open" ? "BEFORE FIX, " : (r.status === "fixed" || r.status === "matched") ? "after fix, " : "";
  if (r.gif) return `<figure class="clip port"><figcaption>Port | exe, real time (${when}port @${esc(r.gif_head)}) &mdash; click to enlarge</figcaption>
    <img loading="lazy" src="${esc(r.gif)}" alt="${esc(r.skill)} port vs exe, real time"></figure>`;
  if (r.gif_why) return `<div class="nogif">no port|exe clip &mdash; ${esc(r.gif_why)}</div>`;
  return "";
}
function mediaRow(r){
  const a = clipHtml(r), b = refHtml(r);
  if (!a && !b) return "";
  return `<tr class="media"><td colspan="7"><div class="clips${a && b ? "" : " one"}">${a}${b}</div></td></tr>`;
}
const lb = document.createElement("div"); lb.id = "lb"; lb.innerHTML = "<img alt=''>";
document.addEventListener("DOMContentLoaded", () => document.body.appendChild(lb));
lb.onclick = () => lb.classList.remove("on");
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("on"); });
document.addEventListener("click", e => {
  const im = e.target.closest && e.target.closest("figure.clip img");
  if (im) { lb.firstChild.src = im.src; lb.classList.add("on"); }
});
function row(r){
  const tags = r.lane.map(t => `<span class="in">${esc(t)}</span>`).join("")
             + r.off.map(t => `<span>${esc(t)}</span>`).join("");
  const clip = r.clip_url ? `<div class="meta"><a href="${esc(r.clip_url)}" target="_blank" rel="noopener">clip: ${esc(r.clip)}</a></div>` : "";
  const hist = r.hist.length ? `<div class="meta">${r.hist.map(h => esc(h.at + " " + h.from + "→" + h.to)).join("<br>")}${r.head ? "<br>port " + esc(r.head) : ""}</div>` : "";
  const plain = (r.plain_th || r.plain_en)
    ? `${r.plain_th ? `<div class="pth">${esc(r.plain_th)}</div>` : ""}${r.plain_en ? `<div class="pen">${esc(r.plain_en)}</div>` : ""}`
    : "";
  const tech = (r.note || r.hist.length)
    ? `<details class="tech"><summary>technical details</summary>${r.note ? `<div>${esc(r.note)}</div>` : ""}${hist}</details>`
    : "";
  const what = plain || r.note
    ? plain + tech
    : (r.status === "open" ? '<span class="res">not started</span>' : hist);
  return `<tr id="r${r.row}">
    <td class="n"><a href="#r${r.row}">${r.row}</a></td>
    <td class="sk">${esc(r.skill)}<small>${esc(r.cls)}</small></td>
    <td><span class="res">${esc(r.result)}</span></td>
    <td class="th">${r.comment ? esc(r.comment) : '<span class="res">—</span>'}${r.expected && r.expected !== "None" ? `<div class="e">${esc(r.expected)}</div>` : ""}${clip}</td>
    <td class="tags">${tags}</td>
    <td><span class="st" style="background:var(--s-${r.status})" title="${esc(expl[r.status]||"")}">${esc(label[r.status]||r.status)}</span>${r.at ? `<div class="res">${esc(r.at)}</div>` : ""}</td>
    <td class="note">${what}</td></tr>${mediaRow(r)}`;
}
function draw(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const c = document.getElementById("cls").value;
  const lane = document.getElementById("lane").checked;
  const hit = DATA.filter(r =>
    (!want.size || want.has(r.status)) && (!c || r.cls === c) && (!lane || r.lane.length) &&
    (!q || [r.row, r.skill, r.cls, r.comment, r.expected, r.note, r.plain_th, r.plain_en, r.clip].join(" ").toLowerCase().includes(q)));
  document.getElementById("tb").innerHTML = hit.map(row).join("");
  document.getElementById("empty").hidden = hit.length > 0;
  document.getElementById("count").textContent = `${hit.length} of ${DATA.length} rows`;
  const p = new URLSearchParams();
  if (want.size) p.set("s", [...want].join(","));
  if (c) p.set("c", c);
  if (q) p.set("q", q);
  if (!/^#r\d+$/.test(location.hash) || p.toString())
    history.replaceState(null, "", p.toString() ? "#" + p : location.pathname);
}
readHash(); chips(); classes(); readHash();
["q","cls","lane"].forEach(id => document.getElementById(id).addEventListener("input", draw));
draw();
if (/^#r\d+$/.test(location.hash)) document.querySelector(location.hash)?.scrollIntoView({block:"center"});
